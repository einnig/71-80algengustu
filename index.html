<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markorð: 71 - 80 algengustu orðin.</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }

        .lang-selector {
            margin-bottom: 20px;
            background: #fff3e0;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #ffcc80;
        }

        .lang-selector select {
            padding: 8px;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 10px;
            max-width: 300px;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.2em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
            text-align: left;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.1em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px; 
            line-height: 1.6; 
            border-left: 6px solid #1a73e8; 
            margin-top: 15px;
            display: inline-block;
            min-width: 70%;
        }
        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 20px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }

        .feedback-note {
            margin-top: 40px;
            font-size: 0.95em;
            color: #555;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .feedback-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Markorð: 71 - 80 algengustu orðin.</h1>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="lang-selector">
        <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
        <select id="languageSelect" onchange="updateUI()">
            <option value="ar">Arabíska – العربية</option>
            <option value="da">Danska – Dansk</option>
            <option value="en" selected>Enska – English</option>
            <option value="tl">Filippseyska – Tagalog / Filipino</option>
            <option value="fr">Franska – Français</option>
            <option value="lv">Lettneska – Latviešu</option>
            <option value="lt">Litháíska – Lietuvių</option>
            <option value="no">Norska – Norsk</option>
            <option value="fa">Persneska – فارسی</option>
            <option value="pt">Portúgalska – Português</option>
            <option value="pl">Pólska – Polski</option>
            <option value="ro">Rúmenska – Română</option>
            <option value="ru">Rússneska – Русский</option>
            <option value="es">Spænska – Español</option>
            <option value="sv">Sænska – Svenska</option>
            <option value="th">Tælenska – ภาษาไทย</option>
            <option value="uk">Úkraínska – Українська</option>
            <option value="vi">Víetnamska – Tiếng Việt</option>
        </select>
    </div>

    <div id="counter"></div>
    
    <div id="target"></div>
    <div id="is-explanation"></div>
    <br>
    <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
    
    <div id="spoken"></div>
    <div id="result"></div>

    <div id="media-box"></div>

    <div class="nav-btns">
        <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
        <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
    </div>

    <div class="feedback-note">
        Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
    </div>
</div>

<script>
const exerciseData = [
    { 
        text: "verður", 
        is_exp: "<b>Útskýring:</b> Sögnin „að verða“ í framtíð eða til að lýsa breytingu.<br><b>Samheiti:</b> á eftir að vera, hlýtur.<br><b>Dæmi:</b> Þetta <b>verður</b> mjög gaman.",
        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b> الشرح: الفعل 'يصبح' أو 'سيكون' في المستقبل.<br><b>مرادف:</b> سيكون.<br>مثال: هذا <b>سيكون</b> ممتعاً جداً.</div>",
            "da": "<b>Danska (Dansk):</b> Forklaring: Udsagnsordet 'at blive' i fremtid eller for at beskrive forandring.<br><b>Synonym:</b> kommer til at være.<br>Eksempel: Dette <b>bliver</b> meget sjovt.",
            "en": "<b>Enska (English):</b> Explanation: The verb 'to become' or 'will be' (future).<br><b>Synonym:</b> will be.<br>Example: This <b>will be</b> very fun.",
            "tl": "<b>Filippseyska (Tagalog):</b> Paliwanag: Pandiwang 'maging' o 'mangyayari' sa hinaharap.<br><b>Kasingkahulugan:</b> magiging.<br>Halimbawa: Ito ay <b>magiging</b> napakasaya.",
            "fr": "<b>Franska (Français):</b> Explication: Le verbe 'devenir' ou 'sera' (futur).<br><b>Synonyme:</b> sera, va être.<br>Exemple: Ce <b>sera</b> très amusant.",
            "lv": "<b>Lettneska (Latviešu):</b> Paskaidrojums: Darbības vārds 'kļūt' vai 'būs' (nākotne).<br><b>Sinonīms:</b> būs.<br>Piemērs: Tas <b>būs</b> ļoti jautri.",
            "lt": "<b>Litháíska (Lietuvių):</b> Paaiškinimas: Veiksmažodis 'tapti' arba 'bus' ateityje.<br><b>Sinonimas:</b> bus.<br>Pavyzdys: Tai <b>bus</b> labai smagu.",
            "no": "<b>Norska (Norsk):</b> Forklaring: Verbet 'å bli' i fremtid eller for å beskrive en endring.<br><b>Synonym:</b> kommer til å være.<br>Eksempel: Dette <b>blir</b> veldig gøy.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b> توضیح: فعل «شدن» یا «خواهد بود» در زمان آینده.<br><b>مترادف:</b> خواهد بود.<br>مثال: این بسیار جالب <b>خواهد بود</b>.</div>",
            "pt": "<b>Portúgalska (Português):</b> Explicação: O verbo 'tornar-se' ou 'será' no futuro.<br><b>Sinônimo:</b> vai ser.<br>Exemplo: Isso <b>será</b> muito divertido.",
            "pl": "<b>Pólska (Polski):</b> Wyjaśnienie: Czasownik 'zostać' lub 'będzie' (przyszłość).<br><b>Synonim:</b> będzie.<br>Przykład: To <b>będzie</b> świetna zabawa.",
            "ro": "<b>Rúmenska (Română):</b> Explicație: Verbul 'a deveni' sau 'va fi' (viitor).<br><b>Sinonim:</b> va fi.<br>Exemplu: Acest lucru <b>va fi</b> foarte distractiv.",
            "ru": "<b>Rússneska (Русский):</b> Объяснение: Глагол 'стать' или 'будет' (будущее время).<br><b>Синоним:</b> будет.<br>Пример: Это <b>будет</b> очень весело.",
            "es": "<b>Spænska (Español):</b> Explicación: El verbo 'convertirse' o 'será' en el futuro.<br><b>Sinónimo:</b> va a ser, será.<br>Ejemplo: Esto <b>será</b> muy divertido.",
            "sv": "<b>Sænska (Svenska):</b> Förklaring: Verbet 'att bli' i framtid eller för att beskriva en förändring.<br><b>Synonym:</b> kommer att vara.<br>Exempel: Detta <b>blir</b> mycket roligt.",
            "th": "<b>Tælenska (ภาษาไทย):</b> คำอธิบาย: กริยา 'จะกลายเป็น' หรือ 'จะเป็น' (อนาคต)<br><b>คำพ้องความหมาย:</b> จะเป็น<br>ตัวอย่าง: นี่<b>จะ</b>สนุกมาก",
            "uk": "<b>Úkraínska (Українська):</b> Пояснення: Дієслово 'стати' або 'буде' (майбутній час).<br><b>Синонім:</b> буде.<br>Приклад: Це <b>буде</b> дуже весело.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Động từ 'trở thành' hoặc 'sẽ là' (tương lai).<br><b>Từ đồng nghĩa:</b> sẽ là.<br>Ví dụ: Điều này <b>sẽ</b> rất vui."
        }
    },
    { 
        text: "mjög", 
        is_exp: "<b>Útskýring:</b> Atviksorð sem gefur aukna áherslu og stækkar merkingu annarra orða.<br><b>Samheiti:</b> afar, gríðarlega, rosalega.<br><b>Dæmi:</b> Hún er <b>mjög</b> glöð í dag.",
        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b> الشرح: ظرف يعطي تأكيداً أكبر للكلمات.<br><b>مرادف:</b> للغاية، بشدة.<br>مثال: هي سعيدة <b>جداً</b> اليوم.</div>",
            "da": "<b>Danska (Dansk):</b> Forklaring: Et biord, der giver ekstra vægt til andre ord.<br><b>Synonym:</b> yderst, utrolig.<br>Eksempel: Hun er <b>meget</b> glad i dag.",
            "en": "<b>Enska (English):</b> Explanation: Adverb that gives extra emphasis to other words.<br><b>Synonym:</b> extremely, really.<br>Example: She is <b>very</b> happy today.",
            "tl": "<b>Filippseyska (Tagalog):</b> Paliwanag: Pang-abay na nagpapabigat sa kahulugan ng ibang salita.<br><b>Kasingkahulugan:</b> sobra, talaga.<br>Halimbawa: Siya ay <b>napakasaya</b> ngayon.",
            "fr": "<b>Franska (Français):</b> Explication: Adverbe qui donne plus d'intensité à d'autres mots.<br><b>Synonyme:</b> extrêmement, vraiment.<br>Exemple: Elle est <b>très</b> heureuse aujourd'hui.",
            "lv": "<b>Lettneska (Latviešu):</b> Paskaidrojums: Apstākļa vārds, kas dod papildu uzsvaru citiem vārdiem.<br><b>Sinonīms:</b> ārkārtīgi, stipri.<br>Piemērs: Viņa šodien ir <b>ļoti</b> priecīga.",
            "lt": "<b>Litháíska (Lietuvių):</b> Paaiškinimas: Prievezmis, suteikiantis papildomą pabrėžimą kitiems žodžiams.<br><b>Sinonimas:</b> be galo, itin.<br>Pavyzdys: Ji šiandien <b>labai</b> laiminga.",
            "no": "<b>Norska (Norsk):</b> Forklaring: Adverb som gir ekstra vekt til andre ord.<br><b>Synonym:</b> uhyre, utrolig.<br>Eksempel: Hun er <b>veldig</b> glad i dag.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b> توضیح: قیدی که برای تأکید بیشتر استفاده می‌شود.<br><b>مترادف:</b> بی‌نهایت، واقعاً.<br>مثال: او امروز <b>خیلی</b> خوشحال است.</div>",
            "pt": "<b>Portúgalska (Português):</b> Explicação: Advérbio que dá ênfase extra a outras palavras.<br><b>Sinônimo:</b> extremamente, bastante.<br>Exemplo: Ela está <b>muito</b> feliz hoje.",
            "pl": "<b>Pólska (Polski):</b> Wyjaśnienie: Przysłówek, który daje dodatkowy nacisk na inne słowa.<br><b>Synonim:</b> niezwykle, wyjątkowo.<br>Przykład: Ona jest dzisiaj <b>bardzo</b> szczęśliwa.",
            "ro": "<b>Rúmenska (Română):</b> Explicație: Adverb care dă un accent suplimentar altor cuvinte.<br><b>Sinonim:</b> extrem de, cu adevărat.<br>Exemplu: Ea este <b>foarte</b> fericită astăzi.",
            "ru": "<b>Rússneska (Русский):</b> Объяснение: Наречие, которое усиливает значение других слов.<br><b>Синоним:</b> крайне, чрезвычайно.<br>Пример: Она сегодня <b>очень</b> рада.",
            "es": "<b>Spænska (Español):</b> Explicación: Adverbio que da énfasis extra a otras palabras.<br><b>Sinónimo:</b> extremadamente, realmente.<br>Ejemplo: Ella está <b>muy</b> feliz hoy.",
            "sv": "<b>Sænska (Svenska):</b> Förklaring: Adverb som ger extra betoning till andra ord.<br><b>Synonym:</b> ytterst, oerhört.<br>Exempel: Hon är <b>mycket</b> glad i dag.",
            "th": "<b>Tælenska (ภาษาไทย):</b> คำอธิบาย: กริยาวิเศษณ์ที่เน้นย้ำคำอื่นๆ<br><b>คำพ้องความหมาย:</b> อย่างยิ่ง, มากๆ<br>ตัวอย่าง: วันนี้เธอมีความสุข<b>มาก</b>",
            "uk": "<b>Úkraínska (Українська):</b> Пояснення: Прислівник, що підсилює значення інших слів.<br><b>Синонім:</b> вкрай, надзвичайно.<br>Приклад: Вона сьогодні <b>дуже</b> щаслива.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Trạng từ tạo sự nhấn mạnh cho các từ khác.<br><b>Từ đồng nghĩa:</b> vô cùng, cực kỳ.<br>Ví dụ: Hôm nay cô ấy <b>rất</b> vui."
        }
    },
    { 
        text: "væri", 
        is_exp: "<b>Útskýring:</b> Sögnin „að vera“ í viðtengingarhætti þátíðar. Notað um eitthvað sem gæti gerst eða maður óskar sér.<br><b>Andheiti:</b> er (í raun og veru).<br><b>Dæmi:</b> Það <b>væri</b> fínt að fá ís.",
        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b> الشرح: صيغة الشرط/التمني للفعل 'يكون'.<br><b>مضاد:</b> هو (في الواقع).<br>مثال: <b>سيكون</b> من الرائع الحصول على آيس كريم.</div>",
            "da": "<b>Danska (Dansk):</b> Forklaring: 'At være' i konjunktiv. Bruges om noget man ønsker eller som kunne ske.<br><b>Antonym:</b> er (faktisk).<br>Eksempel: Det <b>ville være</b> dejligt med en is.",
            "en": "<b>Enska (English):</b> Explanation: Subjunctive past of 'to be'. Used for wishes or things that could happen.<br><b>Antonym:</b> is (in reality).<br>Example: It <b>would be</b> nice to get ice cream.",
            "tl": "<b>Filippseyska (Tagalog):</b> Paliwanag: Subjunctive form ng 'to be'. Ginagamit sa paghiling.<br><b>Kasalungat:</b> ay (sa totoo lang).<br>Halimbawa: <b>Maging</b> masarap sana kung may ice cream.",
            "fr": "<b>Franska (Français):</b> Explication: Le verbe 'être' au conditionnel/subjonctif. Utilisé pour les souhaits ou les possibilités.<br><b>Antonyme:</b> est (en réalité).<br>Exemple: Ce <b>serait</b> bien d'avoir une glace.",
            "lv": "<b>Lettneska (Latviešu):</b> Paskaidrojums: 'Būt' vēlējuma izteiksmē. Lieto vēlmēm vai iespējām.<br><b>Antonīms:</b> ir (īstenībā).<br>Piemērs: <b>Būtu</b> jauki dabūt saldējumu.",
            "lt": "<b>Litháíska (Lietuvių):</b> Paaiškinimas: 'Būti' tariamojoje nuosakoje. Naudojamas norams arba galimybėms.<br><b>Antonimas:</b> yra (realybėje).<br>Pavyzdys: <b>Būtų</b> puiku gauti ledų.",
            "no": "<b>Norska (Norsk):</b> Forklaring: 'Å være' i konjunktiv. Brukes om noe man ønsker eller noe som kan skje.<br><b>Antonym:</b> er (faktisk).<br>Eksempel: Det <b>hadde vært</b> fint med is.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b> توضیح: وجه التزامی/شرطی «بودن». برای آرزو یا احتمال.<br><b>متضاد:</b> است (در واقعیت).<br>مثال: <b>خوب می‌شد</b> اگر بستنی داشتیم.</div>",
            "pt": "<b>Portúgalska (Português):</b> Explicação: Condicional/subjuntivo de 'ser/estar'. Usado para desejos ou possibilidades.<br><b>Antônimo:</b> é (na realidade).<br>Exemplo: <b>Seria</b> legal tomar um sorvete.",
            "pl": "<b>Pólska (Polski):</b> Wyjaśnienie: Tryb przypuszczający 'być'. Używany do życzeń lub możliwości.<br><b>Antonim:</b> jest (w rzeczywistości).<br>Przykład: <b>Byłoby</b> miło dostać lody.",
            "ro": "<b>Rúmenska (Română):</b> Explicație: Condiționalul verbului 'a fi'. Folosit pentru dorințe sau posibilități.<br><b>Antonim:</b> este (în realitate).<br>Exemplu: <b>Ar fi</b> frumos să primim înghețată.",
            "ru": "<b>Rússneska (Русский):</b> Объяснение: Сослагательное наклонение глагола 'быть'. Используется для желаний или вероятностей.<br><b>Антоним:</b> есть (в реальности).<br>Пример: <b>Было бы</b> здорово получить мороженое.",
            "es": "<b>Spænska (Español):</b> Explicación: Condicional/subjuntivo de 'ser'. Usado para deseos o cosas que podrían pasar.<br><b>Antónimo:</b> es (en realidad).<br>Ejemplo: <b>Sería</b> bueno tomar un helado.",
            "sv": "<b>Sænska (Svenska):</b> Förklaring: 'Att vara' i konjunktiv. Används om något man önskar eller som kan hända.<br><b>Antonym:</b> är (i verkligheten).<br>Exempel: Det <b>vore</b> trevligt med glass.",

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `

                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'en';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð: 71 - 80 algengustu orðin.', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>

</body>
</html>
